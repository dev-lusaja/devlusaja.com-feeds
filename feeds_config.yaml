# Configuración general
# feeds_months_back: Número de meses hacia atrás para filtrar feeds en los chunks (por defecto 2)
# max_chunks_per_category: Número máximo de archivos chunks a generar por cada categoría/tipo (por defecto null = sin límite)
#   Ejemplo: Si es 30, generará máximo 30 archivos de notice-all-chunk-*, 30 de pappers-arXiv_LG-chunk-*, etc.
config:
  feeds_months_back: 2
  max_chunks_per_category: 30  # null = sin límite, cualquier número > 0 = límite de chunks

# Configuración de exclusiones
# chunks_all: Categorías a excluir de los archivos -all y estadísticas de metadata
# Se agrupan por sourceType (notice, youtube, tiktok, etc.)
exclusions:
  chunks_all:
    notice:
      - OpenAI
      - anthropic
      - DeepMind
      - Nvidia
      - HuggingFace
      - MetaAI
      - GoogleAI
      - Ollama
      - Groq
    pappers:
      - Featured
    # Ejemplo para otros sourceTypes:
    # youtube:
    #   - SomeCategory
    # tiktok:
    #   - AnotherCategory

# Top del día para LinkedIn (src/daily_top.py, workflow daily-top.yml): la IA elige las top_n
# noticias de las últimas hours_back horas de estas categorías y el post se envía a Discord.
# models: se prueban en orden hasta que uno responda bien (los :free de OpenRouter rotan).
# Placeholders de item_template: {numero} (1️⃣..🔟), {titulo}, {fuente} (" (Medio)" o vacío si
# la noticia no trae medio), {resumen}. De post_template: {fecha}, {noticias}.
daily_top:
  categories: [Xataka, Wired_ES, CNN_Espanol, El_Pais, Euronews, ElComercio_PE, GoogleNews_IA, GoogleNews_ML]
  hours_back: 24
  top_n: 5
  # Puntaje = criticidad (0-10, la da la IA) + log2(medios distintos), con este tope: 1 medio → 0, 2 → 1, 4 → 2, 8 → 3
  coverage_bonus_max: 3
  max_candidates: 150
  models:
    - google/gemini-3.8-flash
    - google/gemma-4-31b-it:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/free
  item_template: "{numero} {resumen}"
  post_template: |
    🤖 5 noticias de IA que no debes perderte

    {noticias}

    📰 Estas y más noticias de IA en español: https://devlusaja.com/news

    💬 ¿Cuál te parece más relevante?

    #ArtificialIntelligence #AINews #TechNews
  # Prompt para generar en Gemini la imagen que acompaña el post; llega a Discord como mensaje aparte
  image_prompt_template: |
    Crea una infografía vertical (proporción 4:5, 1080×1350 px) para LinkedIn con las 5 noticias de inteligencia artificial del día.

    Texto que debe aparecer, escrito exactamente así, en español y con sus tildes (no traduzcas, no resumas ni agregues otros textos):
    - Título: "5 noticias de IA que no debes perderte"
    - Debajo del título, la fecha: "{fecha}"
    - Las 5 noticias, en este orden, cada una completa, palabra por palabra:
    {noticias}
    - Al pie: "devlusaja.com/news"
    Ese es todo el texto de la imagen: ninguna otra palabra, cifra ni etiqueta, en ningún idioma.

    Diseño:
    - Una sola columna con exactamente 5 tarjetas del mismo ancho, una debajo de otra, una por noticia; ninguna noticia se repite ni se parte en dos tarjetas.
    - Todas las tarjetas con la misma estructura: el número grande a la izquierda, el texto de la noticia en el centro y un ícono a la derecha.
    - Cada ícono es una ilustración simple de líneas que represente el tema de su noticia, en azul y violeta, sin letras, palabras, números ni cifras.
    - Estilo editorial tecnológico, limpio y moderno, en modo oscuro con esta paleta exacta:
      - Fondo: gris carbón casi negro (#0e1217), con un brillo suave azul y violeta.
      - Sobre el fondo, en los bordes y las esquinas, finas líneas de circuito impreso con nodos y puntos brillantes en azul (#4a9eff) y violeta (#7b68ee), que decoran sin tapar el contenido.
      - Tarjetas: gris oscuro (#1c2127), con borde fino (#2d333b) y esquinas redondeadas.
      - Texto de las noticias en blanco suave (#e1e7ef).
      - Números de las tarjetas con degradado de azul (#4a9eff) a violeta (#7b68ee).
      - Título en blanco, con "5" e "IA" en azul (#4a9eff); la fecha y "devlusaja.com/news" también en azul (#4a9eff).
    - Tipografía sans serif redondeada y limpia (tipo Hind), grande y legible en el celular; el título destaca sobre el resto.
    - Sin marcas de agua, logos de empresas ni rostros de personas reales.

