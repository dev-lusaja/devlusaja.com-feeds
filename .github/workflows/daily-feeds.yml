name: Daily Feeds Update

on:
  schedule:
    # Ejecutar a las 8:00, 14:00 y 20:00 UTC
    - cron: '0 8,14,20 * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para hacer push

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Git User
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    - name: Install rclone
      run: |
        curl https://rclone.org/install.sh | sudo bash

    - name: Configure rclone
      run: |
        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
        chmod 600 ~/.config/rclone/rclone.conf

    - name: Create Data Directory
      run: mkdir -p data

    - name: Restore feeds.db from Drive
      run: |
        rclone copy feeds_ia:feeds_backup/feeds.db ./data/ || echo "No remote DB found or error downloading, starting fresh or using existing if empty."

    - name: Verify Docker Compose
      run: |
        docker compose version

    - name: Check DB
      run: ls -l data/

    - name: Run Feed Collector
      env:
        GIT_AUTO_PUSH: "true"
        GIT_COMMIT_MESSAGE: "chore: auto update feeds"
      run: |
        chmod +x run.sh
        ./run.sh --auto

    - name: Backup feeds.db to Drive
      if: always() # Ejecutar incluso si el script falla, para guardar progreso parcial si lo hubo
      run: |
        rclone copy ./data/feeds.db feeds_ia:feeds_backup/
