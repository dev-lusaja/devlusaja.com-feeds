name: Daily Feeds Update

on:
  # Lo dispara netlify/functions/daily-feeds-trigger.mjs (Netlify Scheduled Function);
  # el "schedule" de GitHub se retrasaba horas o se saltaba ejecuciones.
  workflow_dispatch:

# Comparte grupo con googlenews-hourly.yml: cada uno sube solo su BD, pero ambos despliegan
# el sitio completo; en serie cada deploy lleva lo último de las dos BDs.
concurrency:
  group: feeds-db
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install rclone
      run: |
        curl https://rclone.org/install.sh | sudo bash

    - name: Create Data Directory
      run: mkdir -p data

    - name: Restore DBs from Google Drive
      env:
        RCLONE_CONFIG_GDRIVE_TYPE: drive
        RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        RCLONE_CONFIG_GDRIVE_SCOPE: drive
      run: |
        rclone copy gdrive:feeds_backup ./data --include "*.db" || echo "No remote DB found or error downloading, starting fresh or using existing if empty."

    - name: Verify Docker Compose
      run: |
        docker compose version

    - name: Check DB
      run: ls -l data/

    - name: Run Feed Collector and Deploy to Netlify
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      run: |
        chmod +x run.sh
        ./run.sh --auto

    - name: Backup feeds.db to Google Drive
      if: always() # Ejecutar incluso si el script falla, para guardar progreso parcial si lo hubo
      env:
        RCLONE_CONFIG_GDRIVE_TYPE: drive
        RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        RCLONE_CONFIG_GDRIVE_SCOPE: drive
      run: |
        rclone copy ./data/feeds.db gdrive:feeds_backup/
